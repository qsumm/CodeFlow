<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2383e2"/>
    </marker>
  </defs>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1c2330">一次真实交付的生命周期</text>

  <!-- 泳道标题 -->
  <g font-size="13" font-weight="700" fill="#5a6474">
    <text x="24" y="86">人</text>
    <text x="24" y="176">数字员工</text>
    <text x="24" y="262">平台</text>
  </g>
  <g stroke="#e3e9f2" stroke-width="1">
    <line x1="80" y1="66" x2="1156" y2="66"/>
    <line x1="80" y1="156" x2="1156" y2="156"/>
    <line x1="80" y1="246" x2="1156" y2="246"/>
  </g>

  <!-- 时间轴节点 -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="110" y="64" width="150" height="40" rx="8" fill="#eef4ff" stroke="#9cc0f0"/>
    <text x="185" y="89" fill="#1b4fa8">提交 / 绑定需求</text>
    <rect x="300" y="64" width="150" height="40" rx="8" fill="#eef4ff" stroke="#9cc0f0"/>
    <text x="375" y="89" fill="#1b4fa8">澄清对话确认</text>
    <rect x="490" y="64" width="150" height="40" rx="8" fill="#eef4ff" stroke="#9cc0f0"/>
    <text x="565" y="89" fill="#1b4fa8">验收 · 流转已发布</text>

    <rect x="120" y="154" width="190" height="40" rx="8" fill="#f0f7ff" stroke="#2383e2"/>
    <text x="215" y="179" fill="#1b4fa8">需求澄清(AI)</text>
    <rect x="350" y="154" width="200" height="40" rx="8" fill="#f0f7ff" stroke="#2383e2"/>
    <text x="450" y="179" fill="#1b4fa8">分析 → 编码 → 测试</text>
    <rect x="590" y="154" width="190" height="40" rx="8" fill="#f0f7ff" stroke="#2383e2"/>
    <text x="685" y="179" fill="#1b4fa8">交付 · 代码评审</text>
    <rect x="820" y="154" width="200" height="40" rx="8" fill="#f0f7ff" stroke="#2383e2"/>
    <text x="920" y="179" fill="#1b4fa8">返工收敛(自动)</text>

    <rect x="150" y="244" width="200" height="40" rx="8" fill="#eef4ff" stroke="#9cc0f0"/>
    <text x="250" y="269" fill="#1b4fa8">拉取工单 · 派发执行</text>
    <rect x="410" y="244" width="200" height="40" rx="8" fill="#eef4ff" stroke="#9cc0f0"/>
    <text x="510" y="269" fill="#1b4fa8">进度/产物/时间线留痕</text>
    <rect x="660" y="244" width="200" height="40" rx="8" fill="#e8f7ee" stroke="#7fd0a0"/>
    <text x="760" y="269" fill="#167a3d">状态机流转 · 回写源头</text>
  </g>

  <!-- 连接 -->
  <g stroke="#2383e2" stroke-width="1.5" fill="none" marker-end="url(#arr2)">
    <path d="M260,84 L320,80"/>
    <path d="M500,84 L640,84 L640,104 L215,140"/>
    <path d="M450,194 L450,240"/>
    <path d="M700,194 L760,240"/>
    <path d="M760,244 L700,198"/>
    <path d="M565,104 L565,148"/>
    <path d="M640,264 L1000,84 L640,88" stroke-dasharray="5,4"/>
  </g>
  <text x="1010" y="120" font-size="11" fill="#5a6474">验收后回写禅道</text>
</svg>
