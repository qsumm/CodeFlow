services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ainative
      MYSQL_USER: ainative
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      TZ: Asia/Shanghai
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ainative/docs/ainative-schema.sql:/docker-entrypoint-initdb.d/001-ainative-schema.sql:ro
      - ./ainative/docs/ainative-community-templates.sql:/docker-entrypoint-initdb.d/002-ainative-templates.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-root-me"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [community]

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [community]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [community]

volumes:
  mysql-data:
  minio-data:

networks:
  community:
    name: ainative-community
