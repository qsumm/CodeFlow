# CodeFlow v2:seekdb(MySQL 协议兼容)+ 应用(同 jar 内嵌前端 SPA)。
# schema 由 db-init 任务在 seekdb 就绪后自动导入(docs/seekdb-schema-v1-*.sql)。
services:
  seekdb:
    image: docker.m.daocloud.io/oceanbase/seekdb:latest
    environment:
      ROOT_PASSWORD: ""
    ports:
      - "2882:2881"
    volumes:
      - seekdb-data:/var/lib/seekdb
    restart: unless-stopped
    networks: [community]

  # schema 初始化:等 seekdb 就绪后按序导入三份 DDL(core → rest → workitem)
  db-init:
    image: mysql:8.0
    entrypoint: >
      sh -c '
      echo "waiting for seekdb…" &&
      for i in $$(seq 1 60); do
        mysql -h seekdb -P 2881 -u root -e "SELECT 1" >/dev/null 2>&1 && break
        sleep 5
      done &&
      mysql -h seekdb -P 2881 -u root -e "CREATE DATABASE IF NOT EXISTS ainative_v2" &&
      mysql -h seekdb -P 2881 -u root ainative_v2 < /schema/001-core.sql &&
      mysql -h seekdb -P 2881 -u root ainative_v2 < /schema/002-rest.sql &&
      mysql -h seekdb -P 2881 -u root ainative_v2 < /schema/003-workitem.sql &&
      echo "schema ready (106 tables)"
      '
    volumes:
      - ./ainative/docs/seekdb-schema-v1-core.sql:/schema/001-core.sql:ro
      - ./ainative/docs/seekdb-schema-v1-rest.sql:/schema/002-rest.sql:ro
      - ./ainative/docs/seekdb-schema-v1-workitem.sql:/schema/003-workitem.sql:ro
    restart: "no"
    networks: [community]

  app:
    build:
      context: ./ainative
      dockerfile: APP-META/docker-config/Dockerfile
    environment:
      DB_HOST: seekdb
      DB_PORT: 2881
      DB_NAME: ainative_v2
      DB_USER: root
      DB_PASSWORD: ""
      AINATIVE_JWT_SECRET: ${AINATIVE_JWT_SECRET:-please-change-this-secret-at-least-32-chars}
      AINATIVE_PUBLIC_BASE_URL_V2: ${PUBLIC_BASE_URL:-http://localhost:7001}
      AINATIVE_DOWNLOAD_SECRET: ${DOWNLOAD_SECRET:-please-change-download-secret}
    ports:
      - "7001:7001"
    volumes:
      - app-artifacts:/app/artifacts
    depends_on:
      seekdb:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [community]

volumes:
  seekdb-data:
  app-artifacts:

networks:
  community:
