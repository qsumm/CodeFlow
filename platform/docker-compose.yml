# CodeFlow v2:v2 后端(同 jar 内嵌前端)+ MySQL 8。
# schema 由 compose 自动初始化(docs/seekdb-schema-v1-*.sql 按序执行)。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ainative_v2
      MYSQL_USER: ainative
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      TZ: Asia/Shanghai
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ainative/docs/seekdb-schema-v1-core.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./ainative/docs/seekdb-schema-v1-rest.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro
      - ./ainative/docs/seekdb-schema-v1-workitem.sql:/docker-entrypoint-initdb.d/003-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-root-me"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [community]

  app:
    build:
      context: ./ainative
      dockerfile: APP-META/docker-config/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ainative_v2
      DB_USER: ainative
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      AINATIVE_JWT_SECRET: ${AINATIVE_JWT_SECRET:-please-change-this-secret-at-least-32-chars}
      AINATIVE_PUBLIC_BASE_URL_V2: ${PUBLIC_BASE_URL:-http://localhost:7001}
      AINATIVE_DOWNLOAD_SECRET: ${DOWNLOAD_SECRET:-please-change-download-secret}
    ports:
      - "7001:7001"
    volumes:
      - app-artifacts:/app/artifacts
    depends_on:
      mysql:
        condition: service_healthy
    networks: [community]

volumes:
  mysql-data:
  app-artifacts:

networks:
  community:
